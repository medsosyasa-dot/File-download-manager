name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FileDownloader-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug
        working-directory: FileDownloader-1.7.5
      - uses: actions/upload-artifact@v4
        with:
          name: download-manager-apk
          path: FileDownloader-1.7.5/app/build/outputs/apk/debug/*.apk
